# ──────────────────────────────────────────────────────────────────────────────
#  tmux — sessions, windows (tabs) and panes (splits) inside kitty.
#
#  PREFIX = ctrl-space   (press it, let go, then press the next key)
#
#    prefix + space   ← MENU of everything below. Start here when unsure.
#    prefix + ?       ← searchable cheatsheet
#
#  The status bar turns purple while the prefix is "armed".
# ──────────────────────────────────────────────────────────────────────────────

# ── Basics ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix              # press twice to send ctrl-space to the app

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"
# Undercurl + colored underlines (LSP diagnostics in nvim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on                        # clicking/scrolling works too — no shame
set -g base-index 1                    # windows start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10                 # no lag after <esc> in nvim
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off           # closing a session jumps to another one
set -g display-time 2500               # messages stay long enough to read
set -g repeat-time 600
setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys emacs               # the : prompt behaves like the shell

# ── Reload ────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  tmux config reloaded"

# ── Splits: the key looks like the split ─────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Windows (tabs) ────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind -r n next-window
bind -r p previous-window
bind Tab last-window                   # toggle between the last two windows
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# ── Panes ─────────────────────────────────────────────────────────────────────
# ctrl-h/j/k/l moves between tmux panes AND nvim splits seamlessly
# (vim-tmux-navigator below). The same keys also work after the prefix:
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind x kill-pane                       # no confirmation prompt
bind z resize-pane -Z                  # zoom (toggle full-screen pane)
bind = select-layout even-horizontal
bind b break-pane -d                   # pane → its own window
bind C-l send-keys C-l                 # ctrl-l is navigation; prefix ctrl-l clears

# ── Copy mode (vim keys) ──────────────────────────────────────────────────────
# prefix [  → scroll/search with vim keys, v to select, y to copy, q to quit
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Sessions ──────────────────────────────────────────────────────────────────
# prefix o → fuzzy pick a session / zoxide dir / project and jump there (sesh)
bind o display-popup -E -w 70% -h 60% -T " sessions · type to filter · enter to open " "~/.local/bin/sesh-pick"
bind s choose-tree -Zs                 # built-in tree of sessions/windows
bind S command-prompt -p "new session name:" "new-session -s '%%' -c '#{pane_current_path}'"
bind O switch-client -l                # jump back to the previous session
bind d detach-client

# ── Popups: tools that float over your work ──────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind C-k display-popup -E -w 90% -h 90% k9s        # ctrl-k = kubernetes
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"   # scratch shell
bind ? display-popup -E -w 90% -h 90% "~/.local/bin/keys tmux"
bind / display-popup -E -w 90% -h 90% "~/.local/bin/keys"   # every cheatsheet
bind M-? list-keys

# ── The menu (prefix + space) ─────────────────────────────────────────────────
# Each entry shows the key you'd press after the prefix, so you learn as you go.
bind Space display-menu -T "#[align=centre,fg=#cba6f7,bold] tmux · press a key or click " -x C -y C \
  "Split right                 |" "|" "split-window -h -c '#{pane_current_path}'" \
  "Split down                  -" "-" "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane (toggle)          z" z "resize-pane -Z" \
  "Close pane                  x" x "kill-pane" \
  "Pane → own window           b" b "break-pane -d" \
  "" \
  "New window                  c" c "new-window -c '#{pane_current_path}'" \
  "Rename window               ," , "command-prompt -I '#W' \"rename-window -- '%%'\"" \
  "Last window               Tab" Tab "last-window" \
  "" \
  "Find/switch session         o" o "display-popup -E -w 70% -h 60% '~/.local/bin/sesh-pick'" \
  "Session tree                s" s "choose-tree -Zs" \
  "Previous session            O" O "switch-client -l" \
  "Detach                      d" d "detach-client" \
  "" \
  "Lazygit                     g" g "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit" \
  "Files (yazi)                y" y "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' yazi" \
  "Kubernetes (k9s)       ctrl-k" C-k "display-popup -E -w 90% -h 90% k9s" \
  "Scratch shell               t" t "display-popup -E -w 80% -h 70% -d '#{pane_current_path}'" \
  "" \
  "Copy / scroll mode          [" [ "copy-mode" \
  "Cheatsheet (tmux)           ?" ? "display-popup -E -w 90% -h 90% '~/.local/bin/keys tmux'" \
  "All cheatsheets             /" / "display-popup -E -w 90% -h 90% '~/.local/bin/keys'" \
  "Reload config               r" r "source-file ~/.config/tmux/tmux.conf" \
  "Install/update plugins      I" I "run-shell '~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# ── Look (Catppuccin Mocha) ───────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name — turns purple + shows "PREFIX" while waiting for a key.
set -g status-left "#{?client_prefix,#[bg=#cba6f7#,fg=#11111b#,bold]  PREFIX ,#[bg=#89b4fa#,fg=#11111b#,bold]  #S }#[bg=#181825] "
# Right: the reminder you need most.
set -g status-right "#[fg=#6c7086]#{?pane_in_mode,#[fg=#f9e2af]COPY MODE  ,}#[fg=#6c7086]^space + #[fg=#cba6f7,bold]space#[fg=#6c7086,nobold] menu · #[fg=#cba6f7,bold]?#[fg=#6c7086,nobold] keys  #[fg=#a6e3a1] #h "

setw -g window-status-format "#[fg=#6c7086] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#11111b,bg=#fab387,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines heavy
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded
set -g menu-border-style "fg=#cba6f7"
set -g menu-border-lines rounded
set -g menu-selected-style "bg=#cba6f7,fg=#11111b,bold"
setw -g clock-mode-colour "#cba6f7"

# ── Plugins (prefix + I to install) ───────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # ctrl-hjkl across nvim + tmux
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix ctrl-s save / ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # …automatically, every 15 min
set -g @plugin 'wfxr/tmux-fzf-url'                # prefix u: open a URL on screen

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 70%,50% --prompt="  " --border-label=" open url "'

if "test ! -d ~/.local/share/tmux/plugins/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run '~/.local/share/tmux/plugins/tpm/tpm'
