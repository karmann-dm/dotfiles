# kitty — the terminal. tmux does splits/tabs/sessions, so kitty stays simple.
# Reload this file: cmd+ctrl+,   ·   All kitty shortcuts: `keys kitty`

include themes/catppuccin-mocha.conf

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
# Ligatures off under the cursor so you can see what you're editing.
disable_ligatures cursor

# ── Window ────────────────────────────────────────────────────────────────────
hide_window_decorations titlebar-only
window_padding_width    6 10
confirm_os_window_close 0
remember_window_size    yes
background_opacity      0.97
background_blur         20
macos_show_window_title_in none
macos_quit_when_last_window_closed yes

# ── Keyboard ──────────────────────────────────────────────────────────────────
# Left option acts as Alt/Meta (for shell/nvim word motions); right option
# still types special characters (é, ü, …).
macos_option_as_alt left

# Cursor
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor

# ── Behaviour ─────────────────────────────────────────────────────────────────
enable_audio_bell   no
visual_bell_duration 0
copy_on_select      yes
strip_trailing_spaces smart
scrollback_lines    20000
# cmd+f opens the scrollback in `less` (colors kept) — then / to search.
scrollback_pager    less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
url_style           curly
detect_urls         yes
allow_remote_control yes
listen_on           unix:/tmp/kitty

# ── Shortcuts (kitty's own; tmux handles splits) ──────────────────────────────
# cmd+c / cmd+v            copy / paste
# cmd+= / cmd+- / cmd+0    font size up / down / reset
# cmd+n                    new OS window
# cmd+f                    search scrollback (opens it in less, then /)
# ctrl+shift+e             "hints": pick a URL on screen with the keyboard
# ctrl+shift+p > f         pick a file path on screen and insert it
map cmd+equal      change_font_size all +1.0
map cmd+minus      change_font_size all -1.0
map cmd+0          change_font_size all 0
map cmd+f          show_scrollback
map ctrl+shift+e   open_url_with_hints
map cmd+k          clear_terminal to_cursor active
