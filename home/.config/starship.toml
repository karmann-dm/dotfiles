# Starship prompt — https://starship.rs/config/
# Shows the kubernetes context on the right so you never `kubectl apply` to prod by accident.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = """
$directory$git_branch$git_status$rust$golang$python$nodejs$cmd_duration
$character"""
right_format = """$kubernetes$aws$gcloud"""
palette = "catppuccin_mocha"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
format = "[took $duration](dimmed peach) "

[rust]
symbol = "🦀 "
format = "[$symbol$version](peach) "

[golang]
symbol = " "
format = "[$symbol$version](sapphire) "

[python]
format = '[${symbol}${version}( \($virtualenv\))](yellow) '

[nodejs]
format = "[ $version](green) "
detect_files = ["package.json"]
detect_extensions = []

[kubernetes]
disabled = false
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold sky"
# Contexts that look like production turn red.
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"

[aws]
format = '[$symbol$profile]($style) '
symbol = " "

[gcloud]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
